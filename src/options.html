<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Chess Blocker</title>
    <link href="./style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <h1>Chess Blocker</h1>

    <p class="count"><span id="num-losses">0</span> / <span id="max-losses">5</span> losses</p>
    <p class="note" id="reset-note"></p>

    <button id="break-btn" type="button">Block after this game</button>
    <p class="note" id="break-note"></p>

    <label class="row">
        <input type="checkbox" id="session-disable">
        Pause until browser restarts
    </label>

    <details>
        <summary>Settings</summary>

        <label>Chess.com username
            <input type="text" id="username" autocomplete="off" spellcheck="false">
        </label>
        <label>Max losses
            <input type="number" id="max-games" min="1" step="1">
        </label>

        <fieldset>
            <legend>Counter resets</legend>
            <label class="row"><input type="radio" name="reset-mode" data-reset-mode="rolling"> 24 hours after each loss</label>
            <label class="row"><input type="radio" name="reset-mode" data-reset-mode="midnight"> At midnight</label>
        </fieldset>

        <fieldset>
            <legend>Time controls</legend>
            <label class="row"><input type="checkbox" data-filter="bullet"> Bullet</label>
            <label class="row"><input type="checkbox" data-filter="blitz"> Blitz</label>
            <label class="row"><input type="checkbox" data-filter="rapid"> Rapid</label>
            <label class="row"><input type="checkbox" data-filter="daily"> Daily</label>
        </fieldset>

        <fieldset>
            <legend>Variants</legend>
            <label class="row"><input type="checkbox" data-filter="chess"> Standard</label>
            <label class="row"><input type="checkbox" data-filter="chess960"> Chess960</label>
            <label class="row"><input type="checkbox" data-filter="bughouse"> Bughouse</label>
            <label class="row"><input type="checkbox" data-filter="crazyhouse"> Crazyhouse</label>
            <label class="row"><input type="checkbox" data-filter="threecheck"> 3-Check</label>
            <label class="row"><input type="checkbox" data-filter="kingofthehill"> King of the Hill</label>
        </fieldset>
    </details>

    <script src="shared.js"></script>
    <script src="lossCounter.js"></script>
    <script src="options.js"></script>
</body>

</html>
